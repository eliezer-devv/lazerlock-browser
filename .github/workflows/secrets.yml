name: Secret scan

# This repository is served publicly (GitHub Pages), so NOTHING secret may ever be committed here. Fail the build if
# any private-key material appears in any tracked file. Public keys and the sealed (encrypted) request files are fine.

on:
  push:
    branches: [main, refactor]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No private keys in the public repo
        run: |
          set -uo pipefail
          hits=$(git ls-files -z \
            | xargs -0 -r grep -lIE 'BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::Private key material found in the PUBLIC repo:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no private keys in the public repo."
