name: Build APK

# Runs when the app code changes, or manually: Actions tab > Build APK > Run workflow.
# Each run publishes a new release (v1.0.<run number>) with both apps. Normally a TEST build: a pre-release, which
# only phones with "Get test versions" on update to. When it's good: Actions > "Release to everyone" > Run workflow,
# and every phone updates to exactly that build. (Run by hand, it can go straight to everyone instead.)
on:
  workflow_dispatch:
    inputs:
      everyone:
        description: 'Release straight to everyone (skip testing)'
        type: boolean
        default: false
  push:
    branches: [main]
    # docs/admin.html too: it's packed into the app (the hidden in-app admin).
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android.yml', 'docs/admin.html', 'request-key.pem']
    # (List changes don't start a build: phones download lists themselves. The starter list is
    #  whatever the public list is when the app is next built.)

permissions:
  contents: write   # to save the signing key on the first run and publish releases

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    # Pinned so GitHub's move of ubuntu-latest to Ubuntu 26 can't change the Android build unexpectedly.
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: Check signing password
        run: |
          if [ ${#KEYSTORE_PASSWORD} -lt 20 ]; then
            echo "::error::Add a repository secret named KEYSTORE_PASSWORD, at least 20 characters long. See README, step 3."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # First build only: create the app's signing key, locked with your password, and save it in the repo.
      - name: Create signing key (first build only)
        if: hashFiles('signing/release.p12') == ''
        run: |
          mkdir -p signing
          keytool -genkeypair -keystore signing/release.p12 -storetype PKCS12 -alias whitelist \
            -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=LazerLock"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/release.p12
          git commit -m "Add app signing key (password protected)"
          git push

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          # Builds are occasional, so no caching: this also keeps clear of the separate licence
          # terms that setup-gradle v6 applies to its caching component.
          cache-disabled: true

      # The app's two fonts (Figtree and Bricolage Grotesque, SIL Open Font License), from Google's font
      # collection. If a download fails, the build still works and the app uses the phone's own font.
      - name: Download fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -gfsSL --retry 3 "$base/figtree/Figtree[wght].ttf" -o app/src/main/assets/fonts/Figtree.ttf \
            || echo "::warning::Couldn't download the Figtree font; the app will use the phone's own font."
          curl -gfsSL --retry 3 "$base/bricolagegrotesque/BricolageGrotesque[opsz,wdth,wght].ttf" -o app/src/main/assets/fonts/BricolageGrotesque.ttf \
            || echo "::warning::Couldn't download the Bricolage Grotesque font; the app will use the phone's own font."
          ls -l app/src/main/assets/fonts

      # Pack a copy of the AdGuard ad list into the app, so ad blocking works from the first launch.
      - name: Download ad list
        run: |
          curl -fsSL --retry 3 https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt \
            -o app/src/main/assets/adblock-adguard.txt || echo "::warning::Ad list download failed; phones will fetch it themselves."
          # The content filters' lists (adult, gambling, malware). If one fails, phones fetch it themselves.
          get() { curl -fsSL --retry 3 "$1" -o "app/src/main/assets/$2" && echo "$2: $(grep -c '^||' "app/src/main/assets/$2") sites" \
                  || echo "::warning::Couldn't download $2; phones will fetch it themselves."; }
          get https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/nsfw.txt adult-hagezi.txt
          get https://nsfw.oisd.nl/ adult-oisd.txt
          get https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/gambling.txt gambling-hagezi.txt
          get https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.mini.txt malware-hagezi.txt

      # Fuller ad blocking, entirely from AdGuard: a copy of its lists and its scriptlet code, packed into the app so
      # it works from the first launch. Phones then download them from AdGuard themselves, once a day (Config.kt).
      - name: AdGuard's ad rules
        run: |
          mkdir -p app/src/main/assets/adlists
          get() { curl -fsSL --retry 3 "$1" -o "app/src/main/assets/adlists/$2" && echo "$2: $(wc -l < "app/src/main/assets/adlists/$2") lines" \
                  || echo "::warning::Couldn't download $2; phones will download it themselves."; }
          ag=https://filters.adtidy.org/extension/chromium/filters
          # Ads
          get $ag/2.txt adguard-base.txt; get $ag/11.txt adguard-mobile.txt
          # Trackers
          get $ag/3.txt adguard-tracking.txt; get $ag/17.txt adguard-urltracking.txt
          # Annoyances
          get $ag/18.txt adguard-cookies.txt; get $ag/19.txt adguard-popups.txt; get $ag/20.txt adguard-appbanners.txt
          get $ag/21.txt adguard-otherannoyances.txt; get $ag/22.txt adguard-widgets.txt; get $ag/4.txt adguard-social.txt
          # AdGuard's code for its scriptlets and its advanced element rules
          get https://cdn.jsdelivr.net/npm/@adguard/scriptlets@latest/dist/scriptlets.corelibs.json scriptlets.json
          get https://cdn.jsdelivr.net/npm/@adguard/extended-css@latest/dist/extended-css.min.js extended-css.js

      # The admin page, for the hidden admin screen inside the app.
      - name: Add the admin page
        env:
          REQUESTS_TOKEN: ${{ secrets.REQUESTS_TOKEN }}
        run: |
          cp docs/admin.html app/src/main/assets/admin.html
          rev="$(printf '%s' "$REQUESTS_TOKEN" | tr -d '[:space:]' | rev)"
          sed -i "s/__REQUESTS_TOKEN_REV__/${rev}/" app/src/main/assets/admin.html

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/signing/release.p12
          KEY_ALIAS: whitelist
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          REQUESTS_TOKEN: ${{ secrets.REQUESTS_TOKEN }}
        # Two apps from the same code: the browser (for the phones) and LazerLock Admin (just the admin page).
        run: |
          gradle assembleRelease
          b=app/build/outputs/apk/browser/release/app-browser-release.apk
          a=app/build/outputs/apk/admin/release/app-admin-release.apk
          # If signing didn't apply, Gradle writes "...-release-unsigned.apk" instead and these are missing.
          # Stop with a clear message (and a list of what WAS produced) rather than a silent green build.
          if [ ! -f "$b" ] || [ ! -f "$a" ]; then
            echo "::error::assembleRelease didn't produce the signed APKs. APKs found under app/build/outputs/apk:"
            find app/build/outputs/apk -name '*.apk' -printf '  %p (%s bytes)\n' 2>/dev/null || true
            exit 1
          fi
          cp "$b" lazerlock-browser.apk
          cp "$a" lazerlock-browser-admin.apk
          ls -la lazerlock-browser.apk lazerlock-browser-admin.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v1.0.${{ github.run_number }}
          EVERYONE: ${{ inputs.everyone == true }}
        run: |
          # Both apps go in the same release, each under its own name: lazerlock-browser.apk (the browser) and
          # lazerlock-browser-admin.apk (the admin app). Each app updates from the file with its OWN name.
          # A test build is a pre-release: phones only ever update from the newest normal release, except those
          # with "Get test versions" on. "Re-run" of a build reuses its number: the files are uploaded again.
          NOTES="lazerlock-browser.apk: the browser (for the phones). lazerlock-browser-admin.apk: LazerLock Admin (the admin app)."
          BROWSER_APKS="lazerlock-browser.apk"
          ADMIN_APKS="lazerlock-browser-admin.apk"

          # Safety net: the canonical files must be here, or stop with a clear message instead of a silent green build.
          for f in lazerlock-browser.apk lazerlock-browser-admin.apk; do
            if [ ! -s "$f" ]; then echo "::error::$f is missing or empty — nothing to publish."; exit 1; fi
          done
          ls -la $BROWSER_APKS $ADMIN_APKS

          # Make sure the release exists (create it the first time; a re-run of the same build reuses it).
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            if [ "$EVERYONE" = "true" ]; then
              gh release create "$VERSION" --latest --title "Version ${VERSION#v}" \
                --notes "Built from ${GITHUB_SHA::7}. $NOTES"
            else
              gh release create "$VERSION" --prerelease --title "Test ${VERSION#v}" \
                --notes "TEST BUILD from ${GITHUB_SHA::7}: only phones with \"Get test versions\" get it. When it's good: Actions > Release to everyone. $NOTES"
            fi
          fi

          # Upload (or replace) every named copy in one call. --clobber overwrites them on a re-run.
          gh release upload "$VERSION" $BROWSER_APKS $ADMIN_APKS --clobber

          # Print exactly what ended up on the release, so the log can never hide an empty one.
          echo "Published release: $(gh release view "$VERSION" --json url --jq .url)"
          echo "Assets now on the release:"
          gh release view "$VERSION" --json assets --jq '.assets[].name'

          # (The admin app had its own release, "admin-app", for a while: not needed any more.)
          if gh release view admin-app >/dev/null 2>&1; then gh release delete admin-app --yes --cleanup-tag || true; fi
