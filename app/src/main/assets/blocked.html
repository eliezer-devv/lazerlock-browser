<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // The app passes light or dark, and its colours right now (so this page matches the rest of the app).
  (function () {
    var q = new URLSearchParams(location.hash.slice(1)), r = document.documentElement;
    if (q.get('theme') === 'dark') r.dataset.theme = 'dark';
    var p = (q.get('pal') || '').split('.');
    var names = ['bg', 'ink', 'ink2', 'card', 'outline', 'accent', 'accent-text', 'soft', 'red-bg', 'red-ink'];
    if (p.length === names.length && p.every(function (c) { return /^[0-9A-Fa-f]{6}$/.test(c); })) {
      names.forEach(function (n, i) { r.style.setProperty('--' + n, '#' + p[i]); });
    }
  })();
</script>
<title>Not on the list</title>
<style>
  /* The app's fonts (packed in at build time). If they're missing, the phone's own font is used. */
  @font-face { font-family: 'Figtree'; src: url('fonts/Figtree.ttf') format('truetype'); font-weight: 300 900; font-display: swap; }
  @font-face { font-family: 'Bricolage Grotesque'; src: url('fonts/BricolageGrotesque.ttf') format('truetype'); font-weight: 200 800; font-display: swap; }
  *, *::before, *::after { box-sizing: border-box; }
  :root { --bg: #F5F3EE; --ink: #1C2B2D; --ink2: #3E4B49; --card: #FFFFFF; --outline: #CFDDD8; --accent: #1F5F55;
    --accent-text: #1F5F55; --soft: #E1EEEA; --red-bg: #F7E3DE; --red-ink: #8E3322; }
  :root[data-theme="dark"] { --bg: #1F2B2C; --ink: #ECF2F0; --ink2: #D2DDDA; --card: #304041; --outline: #4A5D5E;
    --accent: #3D8F7E; --accent-text: #9BE3C2; --soft: #2C4A44; --red-bg: #4A2C28; --red-ink: #F7B4A7; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; background: var(--bg);
    color: var(--ink); font: 16.5px/1.5 Figtree, system-ui, sans-serif; }
  main { max-width: 32rem; padding: 1.75rem 1.5rem; }
  .mark { width: 56px; height: 56px; border-radius: 18px; background: var(--red-bg); color: var(--red-ink); display: grid;
    place-items: center; margin-bottom: 1rem; }
  h1 { font: 700 1.7rem/1.2 'Bricolage Grotesque', Figtree, sans-serif; margin: 0 0 .6rem; }
  p { margin: 0 0 1.25rem; color: var(--ink2); }
  code { background: var(--soft); color: var(--accent-text); padding: .1rem .45rem; border-radius: 7px; word-break: break-all;
    font: 600 .92em/1.5 ui-monospace, Menlo, monospace; }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; }
  button, .button { font: 700 1rem/1 Figtree, system-ui, sans-serif; border: 1px solid var(--outline); border-radius: 999px;
    padding: .85rem 1.3rem; background: var(--card); color: var(--accent-text); text-decoration: none; display: inline-flex;
    align-items: center; min-height: 48px; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  [hidden] { display: none !important; }
  /* Small screens (e.g. 2.8-inch phones): smaller text, so the buttons are on screen sooner. */
  @media (max-width: 340px) {
    main { padding: 1rem .8rem; }
    .mark { width: 42px; height: 42px; border-radius: 13px; margin-bottom: .6rem; }
    .mark svg { width: 20px; height: 20px; }
    h1 { font-size: 1.25rem; }
    body { font-size: .9rem; }
    p { margin-bottom: .9rem; }
    button, .button { padding: .6rem 1rem; min-height: 42px; font-size: .92rem; }
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg></div>
  <h1 id="title">This site isn't on the list</h1>
  <p id="msg"></p>
  <p class="actions">
    <a id="ask" class="button primary" href="#">Ask to open</a>
    <button id="back">Go back</button>
  </p>
</main>
<script>
  // Going from one blocked page straight to another only changes the part after "#": reload to show the new one.
  window.addEventListener('hashchange', () => location.reload());
  const q = new URLSearchParams(location.hash.slice(1));
  const target = q.get('url') || '';
  let host = target;
  try { host = new URL(target).hostname; } catch (e) {}
  const msg = document.getElementById('msg');
  let timerAsk = null, timerLabel = '';
  // Blocked by a content filter: say which list it's on.
  const FILTER_NAMES = { adult: 'adult content', gambling: 'gambling', malware: 'malware' };
  if (q.get('reason') === 'filtered') {
    const names = (q.get('filters') || '').split(',').filter(Boolean).map(f => FILTER_NAMES[f] || f);
    document.getElementById('title').textContent = 'Blocked by a filter';
    const c = document.createElement('code'); c.textContent = host || 'this site'; msg.append(c);
    msg.append(` is on the ${names.join(' and ') || 'filter'} list${names.length > 1 ? 's' : ''}, so it's blocked. ` +
      'If you think that\'s a mistake, tap Ask to open: whoever manages this browser will see which list it\'s on.');
  } else if (q.get('reason') === 'timer') {
    // A timer: "Blocked during Homework time" (until 18:00), or a daily allowance that's used up. Ask for time.
    const tname = q.get('tname') || 'a timer', until = q.get('until'), more = q.get('tk') === 'more';
    document.getElementById('title').textContent = more ? `${tname} is used up for today` : q.get('tnone') ? `${tname}: nothing opens now` : `Blocked during ${tname}`;
    if (more) msg.append('Your time on this site is used up for today. It starts again tomorrow. ');
    else {
      const c = document.createElement('code'); c.textContent = host || 'this site'; msg.append(c);
      msg.append(` doesn't open during ${tname}${until ? ', until ' + until : ''}. `);
    }
    msg.append(q.get('noask') ? '' : 'You can ask for time.');
    timerAsk = q.get('noask') ? null : 'wlb://timer-ask?id=' + encodeURIComponent(q.get('tid') || '') + '&k=' + (more ? 'more' : 'off');
    timerLabel = more ? 'Ask for more time' : 'Ask for time';
  } else if (q.get('reason') === 'expired') {
    document.getElementById('title').textContent = 'Time\'s up';
    msg.append('Temporary access to ');
    const c = document.createElement('code'); c.textContent = host || 'this site'; msg.append(c);
    msg.append(' has ended. Tap Ask to open to ask for more time.');
  } else if (q.get('reason') === 'page') {
    document.getElementById('title').textContent = 'This page isn\'t on the list';
    msg.append('Only some pages of ');
    const c = document.createElement('code'); c.textContent = host; msg.append(c);
    msg.append(' are allowed. Tap Ask to open to request this page. If it\'s approved, it opens by itself within a few minutes.');
  } else if (q.get('reason') === 'empty') {
    document.getElementById('title').textContent = 'No sites are allowed yet';
    msg.textContent = 'The list hasn\'t loaded or is empty. Check the internet connection, or add sites to the list on GitHub.';
  } else {
    msg.append('This browser only opens approved sites. Tap Ask to open to request ');
    const c = document.createElement('code'); c.textContent = host || 'this site'; msg.append(c);
    msg.append('. If it\'s approved, this page opens by itself within a few minutes.');
  }
  // Handled by the app, which skips over blocked pages in the history.
  document.getElementById('back').onclick = () => { location.href = 'wlb://back'; };
  const ask = document.getElementById('ask');
  if (q.get('reason') === 'timer') { if (timerAsk) { ask.href = timerAsk; ask.textContent = timerLabel; } else ask.hidden = true; }
  else if (target) ask.href = 'wlb://request?action=allow&url=' + encodeURIComponent(target);
  else ask.href = 'wlb://request?action=allow';
</script>
</body>
</html>
